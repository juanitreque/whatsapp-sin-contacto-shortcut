name: Unrecognized phone format
description: Report a format that is not normalized correctly without publishing personal data.
title: "[Phone format] "
labels:
  - phone-format
body:
  - type: dropdown
    id: source
    attributes:
      label: Input source
      options:
        - Text shared from a website
        - Clipboard
        - Contact
        - Manual input
        - Other
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country and international calling code
      placeholder: "Example: United Kingdom (+44)"
    validations:
      required: true
  - type: textarea
    id: format
    attributes:
      label: Anonymized format
      description: Replace several digits with X. Do not publish a complete personal phone number.
      placeholder: "+44 (0)20 XXXX XXXX"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected result and actual result
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Device and operating-system version
      placeholder: "Example: iPhone, iOS 26"

